<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>My Savings</title><style>
*{box-sizing:border-box}html{touch-action:manipulation}body{margin:0;background:#0c1220;color:#f5f7fc;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}button,input{font:inherit;font-size:16px}button{touch-action:manipulation;cursor:pointer}main{max-width:600px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 45px)}h1{font-size:26px;margin:3px 0 0}h2{font-size:17px;margin:0 0 13px}.sub{color:#aab8ce;font-size:13px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.logo{color:#9bb8ff;font-size:11px;font-weight:800;letter-spacing:2px}.panel{background:#19263b;border:1px solid #2c3d55;border-radius:20px;padding:20px;margin:14px 0}.amount{font-size:36px;font-weight:800;letter-spacing:-1px;margin:10px 0}.positive{color:#77dfaf}.negative{color:#ff929e}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#aab8ce}.small{font-size:13px}.field{display:block;margin:12px 0}.field span{display:block;font-size:13px;color:#b6c3d7;margin-bottom:7px}input{width:100%;background:#0d1727;color:white;border:1px solid #40516d;border-radius:12px;padding:12px;min-height:46px}input:focus{outline:2px solid #8ca9ff}button{border:0;border-radius:12px;padding:12px 16px;font-weight:650}.primary{background:#89a9ff;color:#081122}.secondary{background:#30415c;color:#f4f7ff}.danger{background:#402e3b;color:#ffb6c0}.full{width:100%}.actions{display:flex;gap:8px}.history{display:flex;flex-direction:column;gap:9px}.entry{padding:14px;border-radius:14px;background:#172237;border:1px solid #2b3a51}.entry button{padding:8px 10px;font-size:13px}.bar{height:9px;background:#30415c;border-radius:9px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#91b0ff}.chart{width:100%;height:175px;display:block;overflow:visible}.legend{font-size:12px;color:#aab8ce}.tabs{display:flex;gap:6px;background:#0e192a;border-radius:12px;padding:5px}.tabs button{flex:1;padding:9px;font-size:13px;background:transparent;color:#aab8ce}.tabs button.active{background:#344665;color:white}.empty{padding:16px;color:#aab8ce;text-align:center}.note{font-size:12px;color:#aab8ce;line-height:1.7}
</style></head><body><main><div class="head"><div><div class="logo">MY SAVINGS</div><h1>貯金の記録</h1></div><span style="font-size:30px">◉</span></div><div id="summary"></div><section class="panel"><div class="row"><h2>貯金の推移</h2><div class="tabs"><button id="balanceTab" class="active">残金</button><button id="savingTab">月間貯金</button></div></div><svg id="chart" class="chart" viewBox="0 0 340 175" role="img" aria-label="貯金の推移グラフ"></svg><div id="chartInfo" class="legend"></div></section><section class="panel"><h2>月末の残金を記録</h2><label class="field"><span>記録する月</span><input id="month" type="month"></label><label class="field"><span>その月末に持っているお金（円）</span><input id="amount" type="number" min="0" step="1" inputmode="numeric" placeholder="例：350000"></label><button class="primary full" id="save">記録する</button><p class="note">同じ月を記録すると、その月の金額が更新されます。月間貯金額は前月末との差額です。</p></section><section class="panel"><h2>貯金目標</h2><div class="row"><span class="sub">目標金額</span><button id="goalEdit" class="secondary">変更</button></div><div id="goal"></div></section><section class="panel"><h2>記録履歴</h2><div class="history" id="history"></div></section><section class="panel"><h2>バックアップ</h2><div class="actions"><button class="secondary" id="export">データを書き出す</button><button class="secondary" id="importBtn">復元する</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><p class="note">記録はこの端末のブラウザ内に保存されます。端末変更・ブラウザデータ削除に備えて、定期的にバックアップしてください。</p></section></main><script>
'use strict';const KEY='my-savings-v1';const fmt=n=>'¥'+Math.round(n).toLocaleString('ja-JP');const $=id=>document.getElementById(id);let state={records:{},goal:400000},tab='balance';try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&typeof raw.records==='object'&&raw.records!==null){state.records=raw.records;state.goal=Number(raw.goal)||400000}}catch(e){}const persist=()=>localStorage.setItem(KEY,JSON.stringify(state));const months=()=>Object.keys(state.records).filter(k=>/^\d{4}-(0[1-9]|1[0-2])$/.test(k)&&Number.isFinite(state.records[k])&&state.records[k]>=0).sort();const prevMonth=m=>{let [y,mo]=m.split('-').map(Number);mo--;if(mo===0){mo=12;y--}return y+'-'+String(mo).padStart(2,'0')};const delta=m=>Object.prototype.hasOwnProperty.call(state.records,prevMonth(m))?state.records[m]-state.records[prevMonth(m)]:null;const label=m=>{let [y,mo]=m.split('-');return y+'年'+Number(mo)+'月'};const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function drawChart(ms){let data=ms.slice(-12).map(m=>({m,v:tab==='balance'?state.records[m]:delta(m)})).filter(x=>x.v!==null);let svg=$('chart');if(!data.length){svg.innerHTML='<text x="170" y="90" fill="#aab8ce" font-size="13" text-anchor="middle">記録を追加するとグラフが表示されます</text>';$('chartInfo').textContent='';return}let values=data.map(d=>d.v),min=Math.min(0,...values),max=Math.max(0,...values);if(max===min)max=min+1;let left=16,right=324,top=14,bottom=143;let x=i=>data.length===1?170:left+(right-left)*i/(data.length-1),y=v=>bottom-(v-min)/(max-min)*(bottom-top);let base=y(0);let path=data.map((d,i)=>(i?'L':'M')+x(i)+','+y(d.v)).join(' ');svg.innerHTML=`<line x1="${left}" y1="${base}" x2="${right}" y2="${base}" stroke="#61718a" stroke-width="1"/>`+(tab==='balance'?`<path d="${path}" fill="none" stroke="#91b0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:'')+data.map((d,i)=>tab==='balance'?`<circle cx="${x(i)}" cy="${y(d.v)}" r="4" fill="#91b0ff"/>`:`<rect x="${x(i)-Math.min(14,125/data.length)}" y="${Math.min(base,y(d.v))}" width="${Math.min(28,250/data.length)}" height="${Math.max(2,Math.abs(base-y(d.v)))}" rx="3" fill="${d.v>=0?'#91b0ff':'#ff929e'}"/>`).join('')+data.map((d,i)=>`<text x="${x(i)}" y="165" text-anchor="middle" fill="#aab8ce" font-size="${data.length>8?9:11}">${Number(d.m.slice(5))}月</text>`).join('');$('chartInfo').textContent=tab==='balance'?'月末残金（直近12件）':'前月の記録がある月のみ表示（直近12件）'}
function render(){let ms=months(),last=ms.at(-1),current=last?state.records[last]:null,d=last?delta(last):null;$('summary').innerHTML=`<div class="panel"><div class="sub">最新の月末残金 ${last?'· '+label(last):''}</div><div class="amount">${current===null?'—':fmt(current)}</div><div class="small ${d===null?'muted':d>=0?'positive':'negative'}">${d===null?'前月比 —（前月の記録なし）':`前月比 ${d>=0?'+':'−'}${fmt(Math.abs(d))}`}</div></div>`;drawChart(ms);let progress=current===null?0:Math.min(100,Math.max(0,current/state.goal*100));$('goal').innerHTML=`<div class="row" style="margin-top:12px"><strong>${fmt(state.goal)}</strong><span class="sub">${progress.toFixed(1)}%</span></div><div class="bar"><div class="fill" style="width:${progress}%"></div></div><div class="sub">${current===null?'記録を追加してください':current>=state.goal?'目標達成！':'あと '+fmt(state.goal-current)}</div>`;$('history').innerHTML=ms.length?ms.slice().reverse().map(m=>{let d=delta(m);return `<div class="entry"><div class="row"><div><strong>${label(m)}</strong><div style="margin-top:6px">${fmt(state.records[m])}</div><div class="small ${d===null?'muted':d>=0?'positive':'negative'}">月間貯金 ${d===null?'—':(d>=0?'+':'−')+fmt(Math.abs(d))}</div></div><div class="actions"><button class="secondary" data-edit="${m}">編集</button><button class="danger" data-delete="${m}">削除</button></div></div></div>`}).join(''):'<div class="empty">まだ記録がありません</div>';$('history').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('month').value=b.dataset.edit;$('amount').value=state.records[b.dataset.edit];$('amount').focus();window.scrollTo({top:0,behavior:'smooth'})});$('history').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm(label(b.dataset.delete)+'の記録を削除しますか？')){delete state.records[b.dataset.delete];persist();render()}})}
$('month').value=new Date().toLocaleDateString('sv-SE').slice(0,7);$('save').onclick=()=>{let m=$('month').value,n=$('amount').value;if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)||n.trim()===''||!Number.isSafeInteger(Number(n))||Number(n)<0){alert('月と0円以上の整数を入力してください');return}state.records[m]=Number(n);persist();$('amount').value='';render()};$('goalEdit').onclick=()=>{let v=prompt('目標金額（円）',state.goal);if(v===null)return;if(!/^\d+$/.test(v)||!Number.isSafeInteger(Number(v))||Number(v)<=0){alert('1円以上の整数を入力してください');return}state.goal=Number(v);persist();render()};$('balanceTab').onclick=()=>{tab='balance';$('balanceTab').classList.add('active');$('savingTab').classList.remove('active');render()};$('savingTab').onclick=()=>{tab='saving';$('savingTab').classList.add('active');$('balanceTab').classList.remove('active');render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-savings-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(!obj||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records)||!Number.isSafeInteger(Number(obj.goal))||Number(obj.goal)<=0||Object.entries(obj.records).some(([m,n])=>!/^\d{4}-(0[1-9]|1[0-2])$/.test(m)||!Number.isSafeInteger(n)||n<0))throw Error('形式が正しくありません');if(confirm('現在の記録をバックアップの内容で置き換えますか？')){state={records:obj.records,goal:Number(obj.goal)};persist();render()}}catch(err){alert('復元できません: '+err.message)}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
