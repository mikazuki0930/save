<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#101923"><title>SAVINGS | 貯金管理</title><style>*{box-sizing:border-box}html{touch-action:manipulation}body{margin:0;background:#101923;color:#f5f8fa;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}button,input{font:inherit}button{cursor:pointer}main{max-width:520px;margin:auto;padding:28px 20px 90px}.top{display:flex;justify-content:space-between;align-items:center;color:#a8b5c5;letter-spacing:2px;font-weight:700;font-size:13px}.logo{font-size:23px}.hero{text-align:center;padding:38px 0 26px}.muted{color:#9eacba;font-size:13px}.total{font-size:clamp(36px,10vw,52px);font-weight:750;letter-spacing:-2px;margin:9px 0}.delta{font-size:14px;font-weight:650}.plus{color:#7ed9b1}.minus{color:#ff9b9b}.card{background:#1c2a38;border:1px solid #2b3c4d;border-radius:19px;padding:20px;margin:16px 0}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.bar{height:10px;border-radius:10px;background:#354655;overflow:hidden;margin:14px 0 4px}.bar>div{height:100%;background:#7ed9b1;border-radius:10px;transition:width .25s}h2{font-size:17px;margin:0 0 17px}.field{margin:12px 0}.field label{display:block;color:#a8b5c5;font-size:12px;margin-bottom:8px}input{width:100%;padding:14px;border:1px solid #405265;border-radius:11px;background:#111e2b;color:white;outline:none;font-size:17px}input:focus{border-color:#7ed9b1}.btn{border:0;background:#7ed9b1;color:#10251d;font-weight:750;padding:14px 16px;border-radius:11px}.btn.full{width:100%;margin-top:10px}.secondary{background:#314454;color:#e6edf3}.danger{color:#ff9b9b;background:transparent;border:1px solid #6a4248}.small{padding:8px 10px;font-size:12px}.row{padding:15px 0;border-bottom:1px solid #324252}.row:last-child{border-bottom:0}.row strong{font-size:16px}.right{text-align:right}.sub{font-size:12px;color:#a8b5c5;margin-top:5px}.actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}.empty{text-align:center;color:#a8b5c5;padding:20px 0;font-size:14px}svg{display:block;width:100%;height:auto}.foot{font-size:12px;color:#91a2b1;line-height:1.7;margin-top:25px}.goaledit{display:flex;gap:8px;margin-top:12px}.goaledit input{min-width:0}.hidden{display:none!important}.tag{font-size:12px;color:#7ed9b1}.chartlabel{display:flex;justify-content:space-between;color:#a8b5c5;font-size:11px;margin-top:5px}button:active{transform:scale(.98)}</style></head><body><main><div class="top"><span>SAVINGS</span><span class="logo">◈</span></div><section class="hero"><div class="muted" id="latestMonth">最新の所持金</div><div class="total" id="total">¥0</div><div class="delta" id="change">最初の月末残高を記録しましょう</div></section><section class="card"><div class="between"><strong>貯金目標</strong><button class="btn secondary small" id="editGoal">変更</button></div><div class="between" style="margin-top:15px"><span class="muted" id="goalText"></span><span class="tag" id="percent"></span></div><div class="bar"><div id="progress"></div></div><div class="goaledit hidden" id="goalForm"><input id="goalInput" type="number" inputmode="numeric" min="1" placeholder="目標金額"><button class="btn" id="saveGoal">保存</button></div></section><section class="card"><h2 id="formTitle">月末の所持金を記録</h2><div class="field"><label for="month">対象月</label><input type="month" id="month"></div><div class="field"><label for="amount">月末の総所持金（銀行口座＋現金）</label><input type="number" inputmode="numeric" id="amount" min="0" step="1" placeholder="例：280000"></div><button class="btn full" id="save">記録する</button><button class="btn secondary full hidden" id="cancel">編集をキャンセル</button><div class="sub" style="margin-top:13px">月末時点の合計額を入力してください。前月との差額は自動計算されます。</div></section><section class="card"><h2>所持金の推移</h2><div id="chart"></div></section><section class="card"><div class="between"><h2 style="margin:0">月別の記録</h2><span class="muted" id="count"></span></div><div id="history" style="margin-top:8px"></div></section><div class="foot">記録はこのブラウザの端末内に保存されます。ブラウザのデータ削除や端末変更で失われる場合があります。<div style="margin-top:12px"><button class="btn secondary small" id="export">記録をバックアップ（JSON）</button> <button class="btn secondary small" id="importButton">復元</button><input type="file" accept="application/json,.json" id="importFile" class="hidden"></div></div></main><script>
const KEY='savings-monthly-v1';const $=id=>document.getElementById(id);const yen=n=>'¥'+Number(n).toLocaleString('ja-JP');let data;try{data=JSON.parse(localStorage.getItem(KEY))||{goal:400000,records:{}}}catch{data={goal:400000,records:{}}}if(!data.records||typeof data.records!=='object')data.records={};if(!Number.isFinite(data.goal)||data.goal<=0)data.goal=400000;let editing=null;const now=new Date();$('month').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}function validMonth(m){return /^\d{4}-(0[1-9]|1[0-2])$/.test(m)}function previousMonth(m){let [y,mo]=m.split('-').map(Number);return `${mo===1?y-1:y}-${String(mo===1?12:mo-1).padStart(2,'0')}`}function monthLabel(m){const [y,mo]=m.split('-');return `${y}年${Number(mo)}月`}function entries(){return Object.entries(data.records).filter(([m,a])=>validMonth(m)&&Number.isFinite(a)&&a>=0).sort((a,b)=>a[0].localeCompare(b[0]))}function diff(m,a){const p=previousMonth(m);return Object.prototype.hasOwnProperty.call(data.records,p)?a-data.records[p]:null}function formatDiff(d){return d===null?'前月の記録なし':(d>=0?'+':'−')+yen(Math.abs(d))}function render(){const rows=entries(),latest=rows.at(-1);$('latestMonth').textContent=latest?`${monthLabel(latest[0])}末の所持金`:'最新の所持金';$('total').textContent=yen(latest?latest[1]:0);const d=latest?diff(...latest):null;$('change').textContent=latest?`${formatDiff(d)}${d===null?'':' / 前月比'}`:'最初の月末残高を記録しましょう';$('change').className='delta '+(d===null?'muted':d>=0?'plus':'minus');$('goalText').textContent='目標 '+yen(data.goal);const pct=latest?latest[1]/data.goal*100:0;$('percent').textContent=pct.toFixed(1)+'%';$('progress').style.width=Math.min(100,Math.max(0,pct))+'%';$('count').textContent=rows.length+'件';$('history').replaceChildren();if(!rows.length){const p=document.createElement('div');p.className='empty';p.textContent='まだ記録がありません';$('history').append(p)}for(const [m,a] of [...rows].reverse()){const d=diff(m,a),r=document.createElement('div');r.className='row';const top=document.createElement('div');top.className='between';const left=document.createElement('div');const label=document.createElement('strong');label.textContent=monthLabel(m);left.append(label);const right=document.createElement('div');right.className='right';const value=document.createElement('strong');value.textContent=yen(a);const sub=document.createElement('div');sub.className='sub '+(d===null?'':d>=0?'plus':'minus');sub.textContent='月間貯金額 '+formatDiff(d);right.append(value,sub);top.append(left,right);const actions=document.createElement('div');actions.className='actions';const edit=document.createElement('button');edit.className='btn secondary small';edit.textContent='編集';edit.onclick=()=>{editing=m;$('month').value=m;$('amount').value=a;$('formTitle').textContent='記録を編集';$('save').textContent='変更を保存';$('cancel').classList.remove('hidden');$('amount').focus();window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='btn danger small';del.textContent='削除';del.onclick=()=>{if(confirm(monthLabel(m)+'の記録を削除しますか？')){delete data.records[m];if(editing===m)resetForm();persist()}};actions.append(edit,del);r.append(top,actions);$('history').append(r)}drawChart(rows)}function resetForm(){editing=null;$('formTitle').textContent='月末の所持金を記録';$('save').textContent='記録する';$('cancel').classList.add('hidden');$('amount').value=''}$('cancel').onclick=resetForm;$('save').onclick=()=>{const m=$('month').value,a=Number($('amount').value);if(!validMonth(m)||$('amount').value.trim()===''||!Number.isSafeInteger(a)||a<0){alert('対象月と0円以上の整数金額を入力してください');return}if(editing&&editing!==m)delete data.records[editing];data.records[m]=a;resetForm();persist()};$('editGoal').onclick=()=>{$('goalForm').classList.toggle('hidden');$('goalInput').value=data.goal};$('saveGoal').onclick=()=>{const n=Number($('goalInput').value);if(!Number.isSafeInteger(n)||n<=0){alert('1円以上の目標金額を入力してください');return}data.goal=n;$('goalForm').classList.add('hidden');persist()};function drawChart(rows){const root=$('chart');root.replaceChildren();if(!rows.length){root.innerHTML='<div class="empty">記録するとグラフが表示されます</div>';return}const width=320,height=170,pad=24,vals=rows.map(x=>x[1]),max=Math.max(...vals,1),min=Math.min(0,...vals),range=max-min||1;const points=rows.map((r,i)=>[rows.length===1?width/2:pad+i*(width-2*pad)/(rows.length-1),height-pad-(r[1]-min)/range*(height-2*pad)]);const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox',`0 0 ${width} ${height}`);for(let i=0;i<4;i++){const line=document.createElementNS(ns,'line'),y=pad+i*(height-2*pad)/3;for(const [k,v] of Object.entries({x1:pad,x2:width-pad,y1:y,y2:y,stroke:'#344759','stroke-dasharray':'4 5'}))line.setAttribute(k,v);svg.append(line)}if(points.length>1){const path=document.createElementNS(ns,'polyline');path.setAttribute('points',points.map(p=>p.join(',')).join(' '));path.setAttribute('fill','none');path.setAttribute('stroke','#7ed9b1');path.setAttribute('stroke-width','3');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');svg.append(path)}for(const [x,y] of points){const c=document.createElementNS(ns,'circle');for(const [k,v] of Object.entries({cx:x,cy:y,r:4,fill:'#7ed9b1'}))c.setAttribute(k,v);svg.append(c)}root.append(svg);const labels=document.createElement('div');labels.className='chartlabel';for(const r of [rows[0],...(rows.length>2?[rows[Math.floor((rows.length-1)/2)]]:[]),...(rows.length>1?[rows.at(-1)]:[])]){const s=document.createElement('span');s.textContent=r[0].replace('-','/');labels.append(s)}root.append(labels)}$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='savings-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!obj||!Number.isSafeInteger(obj.goal)||obj.goal<=0||!obj.records||Array.isArray(obj.records)||typeof obj.records!=='object'||Object.entries(obj.records).some(([m,a])=>!validMonth(m)||!Number.isSafeInteger(a)||a<0))throw Error('invalid');if(confirm('現在の記録をバックアップの内容で置き換えますか？')){data={goal:obj.goal,records:obj.records};resetForm();persist()}}catch{alert('有効なバックアップファイルではありません')}e.target.value=''};render();</script></body></html>
